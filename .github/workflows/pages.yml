# Deploy the exam app to GitHub Pages — the static twin of `make serve`.
#
# The site is BUILT here, never committed: `make pages` regenerates every
# 解答.html with the localStorage backend and copies the 聴解 audio next to it,
# so `_site/` stays a build artifact and `tests/` stays the single source.
#
# One-time setup in the repo: Settings → Pages → Build and deployment →
# Source: "GitHub Actions". Nothing else; no gh-pages branch, no /docs folder.
name: Deploy exam app to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'tests/**'
      - '.agents/exam-app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      deploy_audio:
        description: 'Fetch tests/*/聴解.mp3 from Git LFS and deploy it (~0.5 GB of LFS bandwidth per run)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-upload; queued runs
# collapse to the newest, so a burst of pushes deploys once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # NO LFS ON PUSH — deliberate, and the reason is billing, not taste.
      # `lfs: true` makes checkout smudge EVERY LFS object in the tree: the
      # refs/ past-paper archive (~2.6 GB of PDFs and MP3s the site never
      # touches) plus ~0.5 GB of tests/*/聴解.mp3, i.e. ~3 GB of LFS bandwidth
      # on every push under `paths:`. That exhausted the account's LFS budget,
      # after which the batch API refuses every object and checkout itself
      # fails ("This repository exceeded its LFS budget") — the whole deploy
      # dies before a single page is built. With lfs:false the MP3s arrive as
      # pointer stubs, build_pages.py detects them (is_lfs_pointer) and deploys
      # the paper without audio; the sheet's 「MP3を選ぶ」 picker still plays a
      # local file. To publish the audio, run this workflow manually with
      # deploy_audio=true — one ~0.5 GB fetch, only the test MP3s, never refs/.
      - uses: actions/checkout@v7
        with:
          lfs: false

      # Opt-in and non-blocking: if the budget is still exhausted this step
      # fails, the pointers stay pointers, and the site deploys without audio
      # rather than not at all.
      - name: Fetch listening audio from LFS (tests/ only)
        if: ${{ inputs.deploy_audio }}
        continue-on-error: true
        run: git lfs pull --include="tests/**/*.mp3"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # build_booklet.py's renderer; pykakasi supplies the furigana readings;
      # edge-tts is imported at module scope by make_choukai_mp3.py, which
      # `make check-tests` loads to inspect its constants — needed even
      # though this workflow never synthesizes audio.
      - run: pip install markdown pykakasi edge-tts

      # The same read-only gate every local change has to pass, --tests being
      # the per-test contracts only. NON-BLOCKING on purpose: the gate also
      # judges exam CONTENT (passage lengths, 例 reuse, sampled items), and a
      # paper failing those is still a paper you may want to sit. It also reads
      # the MP3s, which are pointer stubs here (see the checkout step), so its
      # audio checks cannot pass in CI at all. Read the step's log.
      - run: make check-tests
        continue-on-error: true

      - run: make pages

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
