name: Deploy exam app to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'tests/**'
      - '.agents/exam-app/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false 
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install markdown pykakasi edge-tts
      - run: make check-tests
        continue-on-error: true
      - run: make pages
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
